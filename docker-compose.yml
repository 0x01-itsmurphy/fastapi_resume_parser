version: "3.8"

services:
  api:
    build: .
    container_name: resume-parser-api
    ports:
      - "8000:8000"
    environment:
      - DEBUG=false
      - LOG_LEVEL=info
      - MAX_FILE_SIZE=10485760
      - CORS_ORIGINS=*
    volumes:
      - ./logs:/code/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
